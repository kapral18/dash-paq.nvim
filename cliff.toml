# git-cliff config for release notes and version bumps (https://git-cliff.org/docs/configuration).
# Only feat/fix/perf commits (or any breaking change) produce a release; everything else is skipped.

[changelog]
body = """
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{% if commit.breaking %}[**breaking**] {% endif %}{{ commit.message | upper_first }} ({{ commit.id | truncate(length=7, end="") }})
{%- endfor %}
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
protect_breaking_commits = true
filter_commits = true
tag_pattern = "v[0-9]+\\.[0-9]+\\.[0-9]+"
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Bug fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = ".*", skip = true },
]

[bump]
# 0.x: feat -> minor, breaking -> minor, fix/perf -> patch; never jump to 1.0.0 automatically.
features_always_bump_minor = true
breaking_always_bump_major = false
initial_tag = "v0.1.0"
